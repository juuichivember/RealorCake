name: Build Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          # เข้าไปยังโฟลเดอร์ที่มี main.py
          cd RealOrCake
          # ถ้าเป็น Windows ให้เพิ่ม --windowed
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --onefile --windowed \
              --add-data "assets;assets" \
              --add-data "states;states" \
              --add-data "decoModule;decoModule" \
              main.py
          else
            pyinstaller --onefile \
              --add-data "assets:assets" \
              --add-data "states:states" \
              --add-data "decoModule:decoModule" \
              main.py
          fi

      - name: List dist folder
        run: |
          echo ">>> Contents of RealOrCake/dist"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            dir RealOrCake\dist
          else
            ls RealOrCake/dist
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: NamkhingCake-${{ matrix.os }}
          path: RealOrCake/dist/**
