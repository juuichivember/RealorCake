# File: RealOrCake/.github/workflows/build.yml
name: Build Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    # ให้ทุกคำสั่ง run รันจากโฟลเดอร์ RealOrCake (ที่มี main.py)
    defaults:
      run:
        working-directory: RealOrCake

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed \
            --add-data "assets;assets" \
            --add-data "states;states" \
            --add-data "decoModule.py;decoModule.py" \
            main.py

      - name: Build macOS executable
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile \
            --add-data "assets:assets" \
            --add-data "states:states" \
            --add-data "decoModule.py:decoModule.py" \
            main.py

      - name: List dist folder
        run: |
          echo ">>> Contents of dist:"
          # 'ls' ใช้ได้ทั้งใน Bash (macOS) และ PowerShell (Windows Runner)
          ls dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamkhingCake-${{ matrix.os }}
          path: RealOrCake/dist/**
