name: Build NamkhingCake

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    defaults:
      run:
        working-directory: RealOrCake

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Setup Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: "Install PyInstaller"
        run: pip install pyinstaller

      - name: "Build Windows executable"
        run: |
          pyinstaller --onefile --windowed \
            --add-data "assets;assets" \
            --add-data "states;states" \
            --add-data "decoModule;decoModule" \
            main.py

      - name: "Debug: list dist directory"
        run: dir dist

      - name: "Upload Windows artifact"
        uses: actions/upload-artifact@v3.1.3
        with:
          name: NamkhingCake-Windows
          path: dist/**

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest

    defaults:
      run:
        working-directory: RealOrCake

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3

      - name: "Setup Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: "Install PyInstaller"
        run: pip install pyinstaller

      - name: "Build macOS binary"
        run: |
          pyinstaller --onefile \
            --add-data "assets:assets" \
            --add-data "states:states" \
            --add-data "decoModule:decoModule" \
            main.py

      - name: "Debug: list dist directory"
        run: ls dist

      - name: "Upload macOS artifact"
        uses: actions/upload-artifact@v3.1.3
        with:
          name: NamkhingCake-macOS
          path: dist/**
