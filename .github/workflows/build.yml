name: Build NamkhingCake

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: |
          cd RealOrCake
          pyinstaller --onefile --windowed \
            --add-data "assets;assets" \
            --add-data "states;states" \
            --add-data "decoModule;decoModule" \
            main.py

      - name: Debug list RealOrCake/dist
        run: dir RealOrCake\dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v2
        with:
          name: NamkhingCake-Windows
          path: RealOrCake/dist/**

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build macOS binary
        run: |
          cd RealOrCake
          pyinstaller --onefile \
            --add-data "assets:assets" \
            --add-data "states:states" \
            --add-data "decoModule:decoModule" \
            main.py

      - name: Debug list RealOrCake/dist
        run: ls RealOrCake/dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v2
        with:
          name: NamkhingCake-macOS
          path: RealOrCake/dist/**
